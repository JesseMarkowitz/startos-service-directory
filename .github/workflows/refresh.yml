name: Refresh service list

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Pillow (puts light registry icons on a dark backing)
        run: python3 -m pip install --quiet "pillow==12.3.0"
      - name: Refresh registries and GitHub search
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh.py
      - name: Open or update the rolling pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes."
            exit 0
          fi
          # One branch, one PR: each run replaces the branch with main + today's refresh,
          # so the open PR always shows everything not yet merged.
          branch="refresh/auto"
          today=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A
          git commit -m "Refresh service list ($today)"
          git push -f origin "$branch"
          missing=$(python3 -c "import json;d=json.load(open('data/services.json'))['services'];print(sum(1 for s in d.values() if not s.get('exclude') and 'replaces' not in s))")
          body=$(printf 'Automated daily refresh, last updated %s. Each run replaces this branch, so this PR always holds every change not yet merged.\n\nReview before merging: new entries are unvetted.\n\nServices without a curated "replaces" entry: %s\n\n```\n%s\n```\n' "$today" "$missing" "$(git diff --stat HEAD~1)")
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "Refresh service list (through $today)" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Refresh service list (through $today)" --body "$body"
          fi
