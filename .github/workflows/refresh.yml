name: Refresh service list

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Pillow (puts light registry icons on a dark backing)
        run: python3 -m pip install --quiet "pillow==12.3.0"
      - name: Refresh registries and GitHub search
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh.py
      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          branch="refresh/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Refresh service list ($(date -u +%Y-%m-%d))"
          git push -f origin "$branch"
          missing=$(python3 -c "import json;d=json.load(open('data/services.json'))['services'];print(sum(1 for s in d.values() if not s.get('exclude') and 'replaces' not in s))")
          body=$(printf 'Automated weekly refresh. Review before merging: new entries are unvetted.\n\nServices still without a curated "replaces" entry: %s\n\n```\n%s\n```\n' "$missing" "$(git diff --stat HEAD~1)")
          gh pr create --base main --head "$branch" --title "Refresh service list ($(date -u +%Y-%m-%d))" --body "$body" \
            || gh pr edit "$branch" --body "$body"
