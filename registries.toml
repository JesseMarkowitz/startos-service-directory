# Registries the refresh script queries. Order here is the order they appear in the README.
# `url` is the address you would add under Marketplace > registries in StartOS.
# A registry that fails to answer keeps its last good snapshot (data/registry-snapshot/).

[[registry]]
slug = "start9"
name = "Start9 Registry"
url = "https://registry.start9.com/"
operator = "Start9"

